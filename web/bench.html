<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>裝置效能量測 — EdgeCascadeLLM</title>
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<style>
  :root {
    --bg: #0b1020; --panel: #151b30; --line: #263050;
    --fg: #e8ecf8; --dim: #97a2c4; --accent: #6ea8ff;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.7 system-ui, -apple-system, "Noto Sans TC", sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 18px; margin: 32px 0 8px; }
  .sub { color: var(--dim); margin: 0 0 24px; }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin: 12px 0;
  }
  button {
    background: var(--accent); color: #05122e; border: 0;
    border-radius: 8px; padding: 12px 20px; font-size: 16px;
    font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  pre {
    background: #080c18; border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 12px; max-height: 320px;
  }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); }
  .dim { color: var(--dim); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  progress { width: 100%; height: 6px; }
  label { font-size: 14px; color: var(--dim); }
  input[type=text] {
    background: #080c18; border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; padding: 8px; font-size: 14px; width: 100%;
  }
</style>
</head>
<body>
<main>
  <h1>裝置效能量測</h1>
  <p class="sub">
    這個頁面會在你的裝置上跑一小段模型，量出三個開發環境量不到的數字。
    全程在你的瀏覽器裡執行，不會上傳任何東西。跑完會給你一段文字，複製貼回給我們就好。
  </p>

  <div class="card">
    <div class="row" style="justify-content: space-between">
      <div>
        <strong>1. 檢查這台裝置</strong>
        <div class="dim" style="font-size:14px">看有沒有 WebGPU、顯示卡是什麼、可用空間多少</div>
      </div>
      <button id="btn-env">開始檢查</button>
    </div>
    <div id="env-out"></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content: space-between">
      <div>
        <strong>2. 跑效能量測</strong>
        <div class="dim" style="font-size:14px">
          會下載一個小模型（約 300 MB），第一次比較久，之後有快取就很快
        </div>
      </div>
      <button id="btn-bench" disabled>開始量測</button>
    </div>
    <div style="margin-top:12px">
      <label for="model-url">模型位置（通常不用改）</label>
      <input type="text" id="model-url" value="./model/">
    </div>
    <div id="bench-progress" style="margin-top:12px"></div>
    <div id="bench-out"></div>
  </div>

  <div class="card" id="report-card" hidden>
    <strong>3. 把結果貼回來</strong>
    <div class="dim" style="font-size:14px; margin-bottom:8px">
      按複製，然後貼到 GitHub issue 或直接傳給我們
    </div>
    <div class="row">
      <button id="btn-copy">複製結果</button>
      <button class="secondary" id="btn-download">下載成檔案</button>
      <span id="copy-msg" class="ok"></span>
    </div>
    <pre id="report-json"></pre>
  </div>

  <p class="dim" style="font-size:13px; margin-top:32px">
    想知道這些數字拿來做什麼？看
    <a href="./" style="color:var(--accent)">專案首頁</a>　·
    <a href="https://github.com/arc119226/edge-cascade-llm" style="color:var(--accent)">原始碼</a>
  </p>
</main>

<script type="module" src="./src/bench-ui.js"></script>
</body>
</html>
